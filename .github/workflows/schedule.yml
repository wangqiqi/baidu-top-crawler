# 百度热搜定时抓取
#
# 设计要点（TASK-007）：
# - cron 每天 4 次，分钟刻意错开整点，缓解 GitHub 免费 runner 的定时任务限流
#   （v0 的 `0 * * * *` 实测被饿死到每天 4~6 次，提交量从 689/月 掉到 50/月）
# - concurrency 串行化：杜绝 v0 「整文件 read-modify-write 并发覆盖」丢数据
# - 依赖缓存 + Python 3.12（v0 是 actions v2 + Python 3.8）
# - 提交前跑数据校验；push 前 pull --rebase，避免 non-fast-forward 静默失败
# - 无变更时跳过提交（v0 无变更时 commit 步骤直接失败）
# - always() 摘要 + ::error:: 注解，失败可见

name: Crawl Baidu Top

on:
  schedule:
    # UTC 01:17 / 07:17 / 13:17 / 19:17 == 北京时间 09:17 / 15:17 / 21:17 / 03:17
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-baidu-top
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl and commit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        id: crawl
        run: python crawl_baidu_top.py

      - name: Verify data integrity
        id: verify
        run: ./scripts/verify.sh --data

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无变更，跳过提交"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "data: 抓取 $(date -u '+%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            echo "### 百度热搜抓取"
            echo ""
            echo "| 步骤 | 结果 |"
            echo "|------|------|"
            echo "| 抓取 | ${{ steps.crawl.outcome }} |"
            echo "| 数据校验 | ${{ steps.verify.outcome }} |"
            echo "| 提交推送 | ${{ steps.commit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: echo "::error::百度热搜抓取失败，请检查 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
