[project]
name = "baidu-top-crawler"
version = "0.2.0"
description = "百度热搜爬虫 —— 数据仓库（v1 紧凑 Markdown 分节）+ 采集脚本"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
# 数据目录与 PlanRun/Super Cursor 模板不是本项目的代码，不纳入 lint
extend-exclude = [".cursor", ".dsh", "20*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["baidutop"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
